name: probe2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe endpoints
        run: python3 scripts/probe2.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "probe2 results"
          git push
