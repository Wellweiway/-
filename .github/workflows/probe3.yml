name: probe3
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/probe3.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "probe3 results"
          git pull --rebase
          git push
