name: fetch-data
on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * 1-5"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch data
        run: python3 scripts/fetch_data.py
      - name: Commit data
        if: always()
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "update data"
          git push
