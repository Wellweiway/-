name: daily-data
on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * 1-5"
    - cron: "30 13 * * 1-5"
    - cron: "30 0 * * 2-6"
permissions:
  contents: write
concurrency:
  group: data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: python3 scripts/fetch_daily.py
      - name: Commit
        if: always()
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "daily data update"
          git pull --rebase
          git push
