
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TWSE 連線測試</title>
</head>
<body>
  <h2>證交所資料連線測試</h2>
  <button id="test">測試連線</button>
  <pre id="result">尚未測試</pre>

  <script>
    document.getElementById("test").onclick = async () => {
      const result = document.getElementById("result");
      result.textContent = "正在連線...";
      try {
        const url =
          "https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL";
        const response = await fetch(url);
        result.textContent = "HTTP 狀態：" + response.status;
        if (!response.ok) throw new Error("HTTP " + response.status);
        const data = await response.json();
        result.textContent =
          "連線成功！取得 " + data.length + " 筆資料。\n\n" +
          JSON.stringify(data.slice(0, 3), null, 2);
      } catch (error) {
        result.textContent =
          "讀取失敗\n錯誤類型：" + error.name +
          "\n錯誤訊息：" + error.message +
          "\n\n請確認網路及瀏覽器跨來源限制（CORS）。";
      }
    };
  </script>
</body>
</html>
